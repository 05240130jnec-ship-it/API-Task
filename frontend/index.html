<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Book Library</h1>

    <div class="add-book">
      <input type="text" id="titleInput" placeholder="Book title" maxlength="255">
      <input type="text" id="authorInput" placeholder="Author" maxlength="255">
      <button id="addBtn">Add</button>
    </div>

    <p id="message" class="message"></p>

    <ul id="bookList"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
